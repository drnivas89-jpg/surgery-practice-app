name: Keep Supabase awake

# Supabase pauses free projects after about a week without database
# activity, which makes the app stop working. This makes one tiny read
# every 3 days so that never happens. The publishable key is the same
# public key the website already ships to every browser; row-level
# security means this read returns no patient data.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: https://ggsvabsduazjupmtgqeb.supabase.co
          SUPABASE_KEY: sb_publishable_kJE1RvSenpY759hpdLROkw_MaiiK4Aw
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/hospitals?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
