name: Checks

# Runs on every push and pull request: if anything here fails, GitHub marks
# the commit with a red cross so a broken change is caught before use.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (COL, fees, alerts)
        run: npm test
      - name: Build
        run: npm run build
